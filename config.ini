[Settings]
# 要整理的目標資料夾
TargetDir = D:\Users\klinlin\Downloads
# 報告輸出的專案位址
ReportDir = f:\Antigravity\AutoFolderOrganization
# 報告檔案路徑 (不設定則預設在 ReportDir 下)
ReportFile = organization_report.txt
ReportJson = organization_report.json
BackupLog = execution_log.txt
# 判定為大檔案的門檻 (單位: MB)
LargeFileThresholdMB = 100

[Categories]
# 定義副檔名分類，多個副檔名以逗號分隔
Images = .jpg, .jpeg, .png, .gif, .bmp, .svg, .ico, .webp, .jfif, .tiff, .tif
Documents = .pdf, .doc, .docx, .xls, .xlsx, .xlsm, .ppt, .pptx, .odt, .csv, .txt, .rtf
Media = .mp4, .mp3, .avi, .mkv, .mov, .wav, .flv, .wmv, .wma, .aac, .ogg
Archives = .zip, .rar, .7z, .tar, .gz, .bz2, .xz
